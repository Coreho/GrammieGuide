<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#E4E2DD;font-family:'Figtree',system-ui,sans-serif;color:#2E2E2C;overflow:hidden;-webkit-tap-highlight-color:transparent}
a{color:#2E2E2C}a:hover{color:#2F7F62}
</style>
</helmet>
<div ref="{{ rootRef }}" style="position:fixed;inset:0;background:var(--page,#E4E2DD);color:var(--ink,#2E2E2C);overflow:hidden">
<div data-screen-label="GrammieGuide Home" style="position:absolute;left:50%;top:50%;width:1440px;height:900px;transform:{{ stageTransform }};--fs:{{ fs }};box-sizing:border-box;padding:40px 64px 32px;display:flex;flex-direction:column;gap:32px;overflow:hidden;background:radial-gradient(120% 90% at 50% 0%,var(--bgA,#F4F3EF) 0%,var(--bgB,#ECEAE5) 60%,var(--bgC,#E6E4DF) 100%);user-select:none">

  <header style="display:flex;flex-direction:column;gap:12px;flex:none">
   <div style="display:flex;flex-wrap:nowrap;align-items:center;justify-content:space-between;gap:48px">
      <div style="display:flex;align-items:baseline;gap:18px;min-width:0;white-space:nowrap">
        <span style="font-size:calc(130px * var(--fs));font-weight:800;letter-spacing:-0.035em;line-height:0.9;color:var(--ink,#2E2E2C);text-shadow:0 2px 0 var(--hl,#fff), 0 8px 18px rgba(var(--sh,60,55,45),.12)">{{ time }}</span>
        <span style="font-size:calc(44px * var(--fs));font-weight:700;color:var(--ink2,#5E5D59)">{{ ampm }}</span>
      </div>

    <div style="display:flex;align-items:center;gap:22px;padding:22px 34px 22px 24px;border-radius:32px;background:linear-gradient(180deg,var(--s1,#FBFAF7),var(--s2,#ECEAE5));box-shadow:inset 0 3px 1px var(--hl,#fff), inset 0 -4px 8px rgba(0,0,0,.05), 0 12px 24px rgba(var(--sh,60,55,45),.14), 0 2px 4px rgba(var(--sh,60,55,45),.1)">
      <div style="position:relative;width:96px;height:80px;flex:none">
        <div style="position:absolute;left:6px;top:0;width:58px;height:58px;border-radius:50%;background:linear-gradient(180deg,#F6E39A,#EDD376);box-shadow:inset 0 2px 1px rgba(255,255,255,.7), 0 6px 12px rgba(170,140,40,.25)"></div>
        <div style="position:absolute;left:26px;top:34px;width:68px;height:38px;border-radius:20px;background:linear-gradient(180deg,var(--c1,#FFFFFF),var(--c2,#E3E1DC));box-shadow:inset 0 2px 1px var(--hl,#fff), 0 8px 14px rgba(var(--sh,60,55,45),.18)"></div>
      </div>
      <div style="display:flex;flex-direction:column;gap:2px">
        <div style="font-size:calc(56px * var(--fs));font-weight:800;line-height:1;letter-spacing:-0.02em">68°</div>
        <div style="font-size:calc(28px * var(--fs));font-weight:600;color:var(--ink2,#4A4945);white-space:nowrap">Partly sunny</div>
      </div>
    </div>
   </div>
   <div style="font-size:calc(36px * var(--fs));font-weight:600;color:var(--ink2,#3E3D3A);line-height:1.2;white-space:nowrap">{{ date }}</div>
  </header>

  <main style="flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:32px;padding:4px 4px 12px">
    <div onClick="{{ openWeather }}" style="min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:18px 12px;border-radius:40px;cursor:pointer;color:var(--tInk1,var(--tInk,inherit));background:var(--tile1,linear-gradient(180deg,var(--s1,#FBFAF7),var(--s2,#ECEAE5)));box-shadow:inset 0 3px 1px var(--hl,#fff), inset 0 -6px 12px rgba(0,0,0,.05), 0 16px 30px rgba(var(--sh,60,55,45),.16), 0 3px 5px rgba(var(--sh,60,55,45),.12);transition:transform .12s, box-shadow .12s" style-active="transform:translateY(3px) scale(.985);box-shadow:inset 0 3px 1px var(--hl,#fff), 0 4px 10px rgba(var(--sh,60,55,45),.14)">
      <div style="width:calc(152px - 40px * var(--fs));height:calc(152px - 40px * var(--fs));flex:none;border-radius:34px;color:var(--wi,var(--ai,#1F5A45));background:var(--well,linear-gradient(180deg,var(--a1,#A6EBD0),var(--a2,#7FD6B4)));box-shadow:inset 0 3px 1px rgba(255,255,255,.75), inset 0 -5px 10px rgba(0,0,0,.08), 0 10px 18px rgba(var(--ag,63,162,126),.28);display:flex;align-items:center;justify-content:center">
        <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"></circle><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"></path></svg>
      </div>
      <div style="font-size:calc(34px * var(--fs));font-weight:700;text-align:center;line-height:1.1;white-space:nowrap">Weather</div>
    </div>

    <div onClick="{{ openPhotos }}" style="min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:18px 12px;border-radius:40px;cursor:pointer;color:var(--tInk2,var(--tInk,inherit));background:var(--tile2,linear-gradient(180deg,var(--s1,#FBFAF7),var(--s2,#ECEAE5)));box-shadow:inset 0 3px 1px var(--hl,#fff), inset 0 -6px 12px rgba(0,0,0,.05), 0 16px 30px rgba(var(--sh,60,55,45),.16), 0 3px 5px rgba(var(--sh,60,55,45),.12);transition:transform .12s, box-shadow .12s" style-active="transform:translateY(3px) scale(.985);box-shadow:inset 0 3px 1px var(--hl,#fff), 0 4px 10px rgba(var(--sh,60,55,45),.14)">
      <div style="width:calc(152px - 40px * var(--fs));height:calc(152px - 40px * var(--fs));flex:none;border-radius:34px;color:var(--wi,var(--ai,#1F5A45));background:var(--well,linear-gradient(180deg,var(--a1,#A6EBD0),var(--a2,#7FD6B4)));box-shadow:inset 0 3px 1px rgba(255,255,255,.75), inset 0 -5px 10px rgba(0,0,0,.08), 0 10px 18px rgba(var(--ag,63,162,126),.28);display:flex;align-items:center;justify-content:center">
        <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><rect x="3" y="4.5" width="18" height="15" rx="3"></rect><circle cx="9" cy="10" r="1.8"></circle><path d="M3.5 17l5-4.5 4 3.5 3-2.5 5 4"></path></svg>
      </div>
      <div style="font-size:calc(34px * var(--fs));font-weight:700;text-align:center;line-height:1.1;white-space:nowrap">Photos</div>
    </div>

    <div onClick="{{ openMessages }}" style="position:relative;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:18px 12px;border-radius:40px;cursor:pointer;color:var(--tInk3,var(--tInk,inherit));background:var(--tile3,linear-gradient(180deg,var(--s1,#FBFAF7),var(--s2,#ECEAE5)));box-shadow:inset 0 3px 1px var(--hl,#fff), inset 0 -6px 12px rgba(0,0,0,.05), 0 16px 30px rgba(var(--sh,60,55,45),.16), 0 3px 5px rgba(var(--sh,60,55,45),.12);transition:transform .12s, box-shadow .12s" style-active="transform:translateY(3px) scale(.985);box-shadow:inset 0 3px 1px var(--hl,#fff), 0 4px 10px rgba(var(--sh,60,55,45),.14)">
      <div style="position:relative;width:calc(152px - 40px * var(--fs));height:calc(152px - 40px * var(--fs));flex:none;border-radius:34px;color:var(--wi,var(--ai,#1F5A45));background:var(--well,linear-gradient(180deg,var(--a1,#A6EBD0),var(--a2,#7FD6B4)));box-shadow:inset 0 3px 1px rgba(255,255,255,.75), inset 0 -5px 10px rgba(0,0,0,.08), 0 10px 18px rgba(var(--ag,63,162,126),.28);display:flex;align-items:center;justify-content:center">
        <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v8a2.5 2.5 0 0 1-2.5 2.5H10l-4.5 3.5V17h0A1.5 1.5 0 0 1 4 15.5z"></path></svg>
        <div style="position:absolute;top:-10px;right:-14px;min-width:44px;height:44px;padding:0 10px;box-sizing:border-box;border-radius:999px;background:var(--ink,#2E2E2C);color:var(--page,#fff);font-size:calc(24px * var(--fs));font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 4px var(--s1,#F6F5F1), 0 6px 10px rgba(0,0,0,.2)">2</div>
      </div>
      <div style="font-size:calc(34px * var(--fs));font-weight:700;text-align:center;line-height:1.1;white-space:nowrap">Messages</div>
    </div>

    <div onClick="{{ openGames }}" style="min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:18px 12px;border-radius:40px;cursor:pointer;color:var(--tInk4,var(--tInk,inherit));background:var(--tile4,linear-gradient(180deg,var(--s1,#FBFAF7),var(--s2,#ECEAE5)));box-shadow:inset 0 3px 1px var(--hl,#fff), inset 0 -6px 12px rgba(0,0,0,.05), 0 16px 30px rgba(var(--sh,60,55,45),.16), 0 3px 5px rgba(var(--sh,60,55,45),.12);transition:transform .12s, box-shadow .12s" style-active="transform:translateY(3px) scale(.985);box-shadow:inset 0 3px 1px var(--hl,#fff), 0 4px 10px rgba(var(--sh,60,55,45),.14)">
      <div style="width:calc(152px - 40px * var(--fs));height:calc(152px - 40px * var(--fs));flex:none;border-radius:34px;color:var(--wi,var(--ai,#1F5A45));background:var(--well,linear-gradient(180deg,var(--a1,#A6EBD0),var(--a2,#7FD6B4)));box-shadow:inset 0 3px 1px rgba(255,255,255,.75), inset 0 -5px 10px rgba(0,0,0,.08), 0 10px 18px rgba(var(--ag,63,162,126),.28);display:flex;align-items:center;justify-content:center">
        <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><rect x="3.5" y="3.5" width="17" height="17" rx="3.5"></rect><circle cx="8.5" cy="8.5" r="1.3" fill="currentColor"></circle><circle cx="15.5" cy="15.5" r="1.3" fill="currentColor"></circle><circle cx="12" cy="12" r="1.3" fill="currentColor"></circle></svg>
      </div>
      <div style="font-size:calc(34px * var(--fs));font-weight:700;text-align:center;line-height:1.1;white-space:nowrap">Games</div>
    </div>
  </main>

  <footer style="flex:none;display:flex;align-items:flex-end;justify-content:space-between;gap:32px">
    <div style="display:flex;align-items:center;gap:18px;padding:12px;border-radius:999px;background:var(--track,#C9C7C1);box-shadow:inset 0 4px 8px rgba(0,0,0,.16), 0 2px 1px rgba(255,255,255,.9)">
      <div onClick="{{ smaller }}" aria-label="Make text smaller" style="width:96px;height:96px;border-radius:50%;display:flex;align-items:center;justify-content:center;gap:2px;cursor:pointer;background:linear-gradient(180deg,var(--s1,#FBFAF7),var(--s3,#E8E6E1));box-shadow:{{ minusShadow }};color:{{ minusColor }};transition:transform .12s" style-active="transform:translateY(2px)">
        <span style="font-size:32px;font-weight:800">A</span><span style="font-size:32px;font-weight:800">−</span>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 4px">
        <div style="font-size:calc(20px * var(--fs));font-weight:700;color:var(--ink,#2E2E2C);white-space:nowrap">Text size</div>
        <div style="display:flex;gap:6px">
          <sc-for list="{{ steps }}" as="s" hint-placeholder-count="5"><span style="width:12px;height:12px;border-radius:50%;background:{{ s.bg }};box-shadow:inset 0 1px 2px rgba(0,0,0,.2)"></span></sc-for>
        </div>
      </div>
      <div onClick="{{ bigger }}" aria-label="Make text bigger" style="width:96px;height:96px;border-radius:50%;display:flex;align-items:center;justify-content:center;gap:2px;cursor:pointer;background:linear-gradient(180deg,var(--s1,#FBFAF7),var(--s3,#E8E6E1));box-shadow:{{ plusShadow }};color:{{ plusColor }};transition:transform .12s" style-active="transform:translateY(2px)">
        <span style="font-size:42px;font-weight:800">A</span><span style="font-size:32px;font-weight:800">+</span>
      </div>
    </div>

    <div onClick="{{ openHelp }}" aria-label="Get help" style="display:flex;align-items:center;gap:22px;padding:18px 44px 18px 18px;border-radius:999px;cursor:pointer;background:linear-gradient(180deg,#D9544F,#BC3A36);color:#fff;box-shadow:inset 0 3px 1px rgba(255,255,255,.35), inset 0 -5px 10px rgba(0,0,0,.15), 0 0 0 7px #FBFAF7, 0 0 0 10px #BC3A36, 0 18px 34px rgba(150,40,40,.35);transition:transform .12s" style-active="transform:translateY(3px) scale(.98)">
      <div style="width:88px;height:88px;flex:none;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 -3px 6px rgba(0,0,0,.1), 0 4px 8px rgba(0,0,0,.2)">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#BC3A36" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"><path d="M5 4h3.5l1.5 4.5-2.2 1.4a11 11 0 0 0 6.3 6.3l1.4-2.2L20 15.5V19a1.5 1.5 0 0 1-1.6 1.5A16.5 16.5 0 0 1 3.5 5.6 1.5 1.5 0 0 1 5 4z"></path></svg>
      </div>
      <div style="display:flex;flex-direction:column;gap:2px">
        <div style="font-size:calc(40px * var(--fs));font-weight:800;line-height:1;white-space:nowrap">Get help</div>
        <div style="font-size:calc(22px * var(--fs));font-weight:600;line-height:1.2;white-space:nowrap">Calls Sarah</div>
      </div>
    </div>
  </footer>

  <sc-if value="{{ hasToast }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;top:40px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:14px;padding:20px 36px;border-radius:24px;background:linear-gradient(180deg,var(--a1,#A6EBD0),var(--a2,#7FD6B4));box-shadow:inset 0 2px 1px rgba(255,255,255,.7), 0 14px 28px rgba(var(--sh,60,55,45),.2);font-size:calc(32px * var(--fs));font-weight:700;color:var(--ai,#1F5A45);white-space:nowrap">{{ toast }}</div>
  </sc-if>

  <sc-if value="{{ helpOpen }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;inset:0;background:rgba(46,46,44,.45);display:flex;align-items:center;justify-content:center;padding:48px">
      <div style="width:820px;max-width:100%;box-sizing:border-box;padding:56px;border-radius:44px;background:linear-gradient(180deg,var(--s1,#FBFAF7),var(--s2,#ECEAE5));box-shadow:inset 0 3px 1px var(--hl,#fff), 0 40px 80px rgba(0,0,0,.3);display:flex;flex-direction:column;align-items:center;gap:28px;text-align:center">
        <div style="width:120px;height:120px;border-radius:50%;background:linear-gradient(180deg,#D9544F,#BC3A36);display:flex;align-items:center;justify-content:center;box-shadow:inset 0 3px 1px rgba(255,255,255,.35), 0 0 0 8px #FBFAF7, 0 0 0 11px #BC3A36">
          <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"><path d="M5 4h3.5l1.5 4.5-2.2 1.4a11 11 0 0 0 6.3 6.3l1.4-2.2L20 15.5V19a1.5 1.5 0 0 1-1.6 1.5A16.5 16.5 0 0 1 3.5 5.6 1.5 1.5 0 0 1 5 4z"></path></svg>
        </div>
        <div style="font-size:calc(52px * var(--fs));font-weight:800;line-height:1.1">Calling Sarah now</div>
        <div style="font-size:calc(30px * var(--fs));font-weight:500;color:var(--ink2,#3E3D3A);line-height:1.35;text-wrap:pretty">You're safe at home. Sarah will be on the line in a moment.</div>
        <div onClick="{{ closeHelp }}" style="margin-top:8px;padding:26px 64px;border-radius:999px;cursor:pointer;background:linear-gradient(180deg,var(--g1,#D3D1CB),var(--g2,#BAB8B2));box-shadow:inset 0 2px 1px rgba(255,255,255,.7), 0 8px 16px rgba(var(--sh,60,55,45),.18);font-size:calc(32px * var(--fs));font-weight:700;color:var(--ink,#2E2E2C)" style-active="transform:translateY(2px)">Hang up</div>
      </div>
    </div>
  </sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Tiles Bold&quot;,&quot;Tiles&quot;,&quot;Mint&quot;,&quot;Butter&quot;,&quot;Sky&quot;,&quot;Evening&quot;],&quot;default&quot;:&quot;Tiles Bold&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;fontScale&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[0,1,1.15,1.3,1.45,1.6],&quot;default&quot;:0,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Preview&quot;},&quot;embedded&quot;:{&quot;editor&quot;:null,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  rootRef = React.createRef();
  THEMES = {
    Mint: { page:'#E4E2DD', bgA:'#F4F3EF', bgB:'#ECEAE5', bgC:'#E6E4DF', s1:'#FBFAF7', s2:'#ECEAE5', s3:'#E8E6E1', hl:'#fff', sh:'60,55,45', ink:'#2E2E2C', ink2:'#4A4945', a1:'#A6EBD0', a2:'#7FD6B4', ai:'#1F5A45', ag:'63,162,126', dot:'#2F7F62', dotOff:'#EDEBE6', dis:'#9C9A95', track:'#C9C7C1', g1:'#D3D1CB', g2:'#BAB8B2', c1:'#FFFFFF', c2:'#E3E1DC' },
    Butter: { page:'#E6DFD0', bgA:'#F8F3E8', bgB:'#EFE8DA', bgC:'#E8E0D0', s1:'#FDFAF3', s2:'#EFE8DA', s3:'#EAE2D2', hl:'#fff', sh:'70,58,35', ink:'#2E2A22', ink2:'#4E473A', a1:'#F6E39A', a2:'#EDD376', ai:'#5C4B12', ag:'170,140,40', dot:'#8A6D12', dotOff:'#F3EEE2', dis:'#A39A86', track:'#CFC6B3', g1:'#DCD3C0', g2:'#C4BAA5', c1:'#FFFFFF', c2:'#E6DFD0' },
    Sky: { page:'#DFE3E8', bgA:'#F3F5F7', bgB:'#E9ECEF', bgC:'#E1E5EA', s1:'#FBFCFD', s2:'#E9ECEF', s3:'#E4E8EC', hl:'#fff', sh:'40,50,65', ink:'#262B31', ink2:'#454C55', a1:'#BFDDF5', a2:'#93C1E8', ai:'#173F63', ag:'60,120,180', dot:'#2F6A9E', dotOff:'#EEF1F4', dis:'#949BA4', track:'#C3CAD2', g1:'#D0D6DD', g2:'#B6BEC8', c1:'#FFFFFF', c2:'#DDE2E8' },
    Tiles: { page:'#132A33', bgA:'#24444F', bgB:'#1E3B45', bgC:'#183239', s1:'#2E4E59', s2:'#23414B', s3:'#203C46', hl:'rgba(255,255,255,.16)', sh:'0,0,0', ink:'#F2F5F6', ink2:'#C7D3D8', a1:'#8FD0AE', a2:'#6DBB93', ai:'#0F3325', ag:'0,0,0', dot:'#8FD0AE', dotOff:'#3A5963', dis:'#6F8790', track:'#0F2228', g1:'#4A6670', g2:'#3B5761', c1:'#F2F5F6', c2:'#BFCBD0',
      tile1:'linear-gradient(180deg,#3782BD,#2A6FA6)', tile2:'linear-gradient(180deg,#44A077,#358A63)', tile3:'linear-gradient(180deg,#6B7887,#5A6675)', tile4:'linear-gradient(180deg,#34506B,#27415A)', tInk:'#FFFFFF', wi:'#FFFFFF', well:'linear-gradient(180deg,rgba(255,255,255,.26),rgba(255,255,255,.12))' },
    'Tiles Bold': { page:'#060F13', bgA:'#12252D', bgB:'#0B1A20', bgC:'#071216', s1:'#1D3642', s2:'#132833', s3:'#10232C', hl:'rgba(255,255,255,.18)', sh:'0,0,0', ink:'#FFFFFF', ink2:'#DDE6EA', a1:'#3FE0A0', a2:'#1FC486', ai:'#04291A', ag:'0,0,0', dot:'#3FE0A0', dotOff:'#2C4652', dis:'#6F8790', track:'#02080A', g1:'#3A5663', g2:'#2C4652', c1:'#FFFFFF', c2:'#C9D4D9',
      tile1:'linear-gradient(180deg,#FFCD33,#FFB800)', tile2:'linear-gradient(180deg,#10A36D,#08855A)', tile3:'linear-gradient(180deg,#2F7FF0,#1463D6)', tile4:'linear-gradient(180deg,#8A52F0,#6D34DB)', tInk:'#FFFFFF', tInk1:'#1A1405', wi:'currentColor', well:'linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,.12))' },
    Evening: { page:'#1C1B19', bgA:'#34332F', bgB:'#2A2926', bgC:'#232220', s1:'#42413D', s2:'#34332F', s3:'#302F2B', hl:'rgba(255,255,255,.14)', sh:'0,0,0', ink:'#F3F1EC', ink2:'#D2CFC8', a1:'#9FE3C8', a2:'#6FC7A5', ai:'#123D2E', ag:'0,0,0', dot:'#7FD6B4', dotOff:'#4A4945', dis:'#7A7873', track:'#191816', g1:'#57554F', g2:'#474642', c1:'#E8E6E1', c2:'#B9B6AF' },
  };
  applyTheme() { const el = this.rootRef.current; if (!el) return; ['tile1','tile2','tile3','tile4','tInk','tInk1','tInk2','tInk3','tInk4','wi','well'].forEach(k => el.style.removeProperty('--' + k)); const t = this.THEMES[this.props.theme] || this.THEMES['Tiles Bold']; for (const k in t) el.style.setProperty('--' + k, t[k]); }
  componentDidUpdate(pp) { if (pp.theme !== this.props.theme) this.applyTheme(); }
  STEPS = [1, 1.15, 1.3, 1.45, 1.6];
  state = { now: new Date(), step: (() => { const v = parseInt(localStorage.getItem('gg-font-step'), 10); return Number.isFinite(v) ? Math.min(4, Math.max(0, v)) : 0; })(), toast: null, helpOpen: false };
  componentDidMount() {
    this.applyTheme();
    this.t = setInterval(() => this.setState({ now: new Date() }), 10000);
    this.onResize = () => this.setState({ scale: this.props.embedded ? 1 : Math.min(window.innerWidth / 1440, window.innerHeight / 900) });
    this.onResize(); window.addEventListener('resize', this.onResize);
  }
  componentWillUnmount() { clearInterval(this.t); clearTimeout(this.tt); window.removeEventListener('resize', this.onResize); }
  setStep(step) { step = Math.min(4, Math.max(0, step)); localStorage.setItem('gg-font-step', step); this.setState({ step }); }
  open(name) { clearTimeout(this.tt); this.setState({ toast: `Opening ${name}…` }); this.tt = setTimeout(() => this.setState({ toast: null }), 1800); }
  renderVals() {
    const { now, step, toast, helpOpen } = this.state;
    const fs = this.props.fontScale ? this.props.fontScale : this.STEPS[step];
    const h = now.getHours(), m = now.getMinutes();
    const part = h < 12 ? 'morning' : h < 17 ? 'afternoon' : h < 21 ? 'evening' : 'night';
    const up = 'inset 0 3px 1px var(--hl,#fff), 0 8px 14px rgba(var(--sh,60,55,45),.2), 0 2px 3px rgba(var(--sh,60,55,45),.14)';
    const dis = 'inset 0 2px 4px rgba(0,0,0,.12)';
    const atMin = step === 0, atMax = step === 4;
    return {
      rootRef: this.rootRef,
      stageTransform: `translate(-50%,-50%) scale(${this.state.scale ?? 1})`,
      fs,
      time: `${h % 12 || 12}:${String(m).padStart(2, '0')}`,
      ampm: h < 12 ? 'AM' : 'PM',
      date: `${now.toLocaleDateString('en-US', { weekday: 'long' })} ${part}, ${now.toLocaleDateString('en-US', { month: 'long', day: 'numeric' })}`,
      steps: this.STEPS.map((_, i) => ({ bg: i <= step ? 'var(--dot,#2F7F62)' : 'var(--dotOff,#EDEBE6)' })),
      smaller: () => this.setStep(step - 1),
      bigger: () => this.setStep(step + 1),
      minusShadow: atMin ? dis : up, minusColor: atMin ? 'var(--dis,#9C9A95)' : 'var(--ink,#2E2E2C)',
      plusShadow: atMax ? dis : up, plusColor: atMax ? 'var(--dis,#9C9A95)' : 'var(--ink,#2E2E2C)',
      openWeather: () => this.open('Weather'), openPhotos: () => this.open('Photos'),
      openMessages: () => this.open('Messages'), openGames: () => this.open('Games'),
      hasToast: !!toast, toast,
      helpOpen,
      openHelp: () => this.setState({ helpOpen: true, toast: null }),
      closeHelp: () => this.setState({ helpOpen: false }),
    };
  }
}
</script>
